# Personal US daily run: DeepSeek analysis, then a short email through Gmail OAuth (personal/send.py).
# Kept in its own file so upstream syncs never conflict with it.
name: US Daily Analysis (personal)

on:
  schedule:
    - cron: '30 21 * * 1-5'   # 21:30 UTC = 13:30 PST, after the US close
  workflow_dispatch:
    inputs:
      force:
        description: Run even when the US market is closed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: us-daily
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt markdown premailer

      - name: Analyze
        id: analyze
        env:
          STOCK_LIST: ${{ vars.STOCK_LIST }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || 'deepseek/deepseek-v4-pro' }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          REPORT_LANGUAGE: zh
          MARKET_REVIEW_ENABLED: 'true'
          MARKET_REVIEW_REGION: us
          MAX_WORKERS: '2'
        run: |
          set -o pipefail
          python main.py --no-notify ${{ inputs.force && '--force-run' || '' }} 2>&1 | tee /tmp/analyze.log
          if grep -q "markets are closed today, skipping run" /tmp/analyze.log; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::US market closed today; no email sent"
          fi

      - name: Restore Gmail OAuth files
        if: always() && steps.analyze.outputs.skip != 'true'
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_OAUTH_KEYS_JSON: ${{ secrets.GMAIL_OAUTH_KEYS_JSON }}
        run: |
          mkdir -p ~/.gmail-mcp && chmod 700 ~/.gmail-mcp
          printf '%s' "$GMAIL_CREDENTIALS_JSON" > ~/.gmail-mcp/credentials.json
          printf '%s' "$GMAIL_OAUTH_KEYS_JSON" > ~/.gmail-mcp/gcp-oauth.keys.json
          chmod 600 ~/.gmail-mcp/*.json

      - name: Send email
        if: steps.analyze.outputs.skip != 'true'
        run: |
          test -n "$(ls reports/report_*.md 2>/dev/null)" || { echo "no stock report produced"; exit 1; }
          grep -q "共分析 \*\*0\*\* 只" reports/report_*.md && { echo "every stock failed"; exit 1; }
          python personal/build_email.py reports /tmp/dsa_email.json "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python personal/send.py /tmp/dsa_email.json

      - uses: actions/upload-artifact@v4
        if: always() && steps.analyze.outputs.skip != 'true'
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          retention-days: 30

      - name: Alert on failure
        if: failure()
        run: |
          echo "US daily analysis failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /tmp/err.txt
          grep -q "Insufficient Balance" /tmp/analyze.log 2>/dev/null && echo "Cause: DeepSeek balance is empty. Top up at https://platform.deepseek.com/top_up" >> /tmp/err.txt
          grep -oE "Succeeded: [0-9]+, failed: [0-9]+" /tmp/analyze.log 2>/dev/null | tail -1 >> /tmp/err.txt || true
          python personal/send.py --failure-alert --run-date "$(date +%F)" --step github_actions --error-file /tmp/err.txt
