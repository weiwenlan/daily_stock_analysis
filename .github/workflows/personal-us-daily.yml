# Personal US daily run: DeepSeek analysis, then a short email through Gmail OAuth (personal/send.py).
# Kept in its own file so upstream syncs never conflict with it.
name: US Daily Analysis (personal)

on:
  schedule:
    # Pre-market. GitHub can delay scheduled runs, so a backup cron runs later and skips if today's email went out.
    - cron: '17 11 * * 1-5'   # 11:17 UTC = 03:17 PST / 06:17 ET
    - cron: '47 12 * * 1-5'   # 12:47 UTC = 04:47 PST / 07:47 ET (backup)
  workflow_dispatch:
    inputs:
      force:
        description: Run even when the US market is closed
        type: boolean
        default: false
      send:
        description: Send the email (off = dry run, artifacts only)
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: us-daily
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip a scheduled run if today's email already went out
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(TZ=America/New_York date +%F)
          N=$(gh run list -R "$GITHUB_REPOSITORY" -w personal-us-daily.yml --event schedule --status success --created ">=$TODAY" --json databaseId -q 'length')
          if [ "$N" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

  analyze:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Shared email template service + sender (private repo, read-only deploy key).
      - uses: actions/checkout@v4
        with:
          repository: weiwenlan/automation-email
          ssh-key: ${{ secrets.AUTOMATION_EMAIL_DEPLOY_KEY }}
          path: automation-email

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: automation-email/package-lock.json

      - run: pip install -r requirements.txt

      - run: npm ci --no-audit --no-fund
        working-directory: automation-email

      - name: Mark run start
        run: echo "RUN_START=$(date -u '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

      - name: Analyze
        id: analyze
        env:
          STOCK_LIST: ${{ vars.STOCK_LIST }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || 'deepseek/deepseek-v4-flash' }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          REPORT_LANGUAGE: zh
          MARKET_REVIEW_ENABLED: 'true'
          MARKET_REVIEW_REGION: us
          MAX_WORKERS: '2'
        run: |
          set -o pipefail
          python main.py --no-notify ${{ inputs.force && '--force-run' || '' }} 2>&1 | tee /tmp/analyze.log
          if grep -q "markets are closed today, skipping run" /tmp/analyze.log; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::US market closed today; no email sent"
          fi
      - name: Retry failed stocks once
        if: steps.analyze.outputs.skip != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || 'deepseek/deepseek-v4-flash' }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          REPORT_LANGUAGE: zh
          MARKET_REVIEW_REGION: us
          MAX_WORKERS: '2'
        run: |
          FAILED=$(grep -oE "\[[A-Z.\-]+\*?\] Analysis (unsuccessful|result marked as failed)|\[[A-Z.\-]+\] Cancelled due to timeout" /tmp/analyze.log | grep -oE "^\[[A-Z.\-]+" | tr -d '[' | sort -u | paste -sd, -)
          if [ -z "$FAILED" ]; then echo "nothing to retry"; exit 0; fi
          echo "retrying: $FAILED"
          cp reports/report_*.md /tmp/first_report.md
          set -o pipefail
          python main.py --no-notify --no-market-review --force-run --stocks "$FAILED" 2>&1 | tee /tmp/retry.log || true
          python personal/merge_reports.py /tmp/first_report.md reports

      - name: Restore Gmail OAuth files
        if: always() && steps.analyze.outputs.skip != 'true'
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_OAUTH_KEYS_JSON: ${{ secrets.GMAIL_OAUTH_KEYS_JSON }}
        run: |
          mkdir -p ~/.gmail-mcp && chmod 700 ~/.gmail-mcp
          printf '%s' "$GMAIL_CREDENTIALS_JSON" > ~/.gmail-mcp/credentials.json
          printf '%s' "$GMAIL_OAUTH_KEYS_JSON" > ~/.gmail-mcp/gcp-oauth.keys.json
          chmod 600 ~/.gmail-mcp/*.json

      - name: Build, render and send email
        if: steps.analyze.outputs.skip != 'true'
        env:
          STOCK_LIST: ${{ vars.STOCK_LIST }}
          SEND: ${{ github.event_name == 'schedule' || inputs.send }}
        run: |
          python personal/build_payload.py --db data/stock_analysis.db --since "$RUN_START" --stocks "$STOCK_LIST" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out email/payload.json
          (cd automation-email && npx tsx src/render.tsx --template stock-premarket \
            --payload ../email/payload.json --out-dir ../email)
          if [ "$SEND" = "true" ]; then
            python automation-email/send.py email/stock-premarket.json
          else
            echo "::notice::dry run: rendered email/stock-premarket.html, not sent"
          fi

      - uses: actions/upload-artifact@v4
        if: always() && steps.analyze.outputs.skip != 'true'
        with:
          name: reports-${{ github.run_id }}
          path: |
            reports/
            email/
            data/stock_analysis.db
          retention-days: 30

      - name: Alert on failure
        if: failure()
        run: |
          echo "US daily analysis failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /tmp/err.txt
          grep -q "Insufficient Balance" /tmp/analyze.log 2>/dev/null && echo "Cause: DeepSeek balance is empty. Top up at https://platform.deepseek.com/top_up" >> /tmp/err.txt
          grep -oE "Succeeded: [0-9]+, failed: [0-9]+" /tmp/analyze.log 2>/dev/null | tail -1 >> /tmp/err.txt || true
          python automation-email/send.py --failure-alert --run-date "$(date +%F)" --step github_actions --error-file /tmp/err.txt
